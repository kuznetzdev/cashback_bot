{% extends "base.html" %}
{% block content %}
<main class="landing-shell">
  <section class="landing-card">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
    {% if error_message %}
      <div class="toast toast-error" role="alert">{{ error_message }}</div>
    {% endif %}
    <section class="auth-grid">
      <form method="post" action="/auth/login" class="auth-form">
        <h2>Login</h2>
        <input type="text" name="username" placeholder="Username" autocomplete="username" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <form method="post" action="/auth/register" class="auth-form">
        <h2>Register</h2>
        <input type="text" name="display_name" placeholder="Display name" autocomplete="name">
        <input type="text" name="username" placeholder="Username" autocomplete="username" required>
        <input type="email" name="email" placeholder="Email (optional)" autocomplete="email">
        <input type="password" name="password" placeholder="Password" autocomplete="new-password" required>
        <button class="btn btn-secondary" type="submit">Create account</button>
      </form>
    </section>
    {% if telegram_enabled %}
    <div class="telegram-login-wrap">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
              data-telegram-login="{{ bot_username }}"
              data-size="large"
              data-radius="12"
              data-auth-url="{{ auth_url }}"
              data-request-access="write"></script>
    </div>
    {% endif %}
  </section>
</main>
{% endblock %}
