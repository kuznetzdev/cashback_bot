name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

concurrency:
  # One CI run per branch/PR — older runs are cancelled when a new commit
  # lands.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.5,<1.0"

      # Lint scope: app/ and tests/. Configuration lives in ruff.toml so
      # local runs and CI agree.
      - name: Run ruff check
        run: ruff check app tests

      - name: Run ruff format check
        run: ruff format --check app tests

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7,<3.0"

      # --strict turns CVE findings into a non-zero exit. We allow CI to
      # warn on high-severity vulnerabilities without blocking — until
      # the project agrees on a policy, we don't want a one-off CVE in a
      # transitive dep to lock everyone out of merging.
      - name: Audit pinned dependencies
        run: pip-audit --requirement requirements.txt --vulnerability-service osv
        continue-on-error: true

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-rus

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax
        run: python -m compileall app tests

      - name: Run test suite
        run: python -m pytest -q

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose syntax
        run: docker compose config -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cashback:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
